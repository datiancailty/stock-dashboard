name: 旧版公开策略更新（已停用）

# 个人操作、反馈、策略结果已迁入 Supabase personal_* 私有空间。
# ChatGPT Plus/Codex 结果由本机 private worker 生成；不再由 GitHub-hosted
# runner 读取个人记录，也不再向 GitHub main/live 写入策略结果。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 说明当前策略更新入口
        run: |
          echo '旧版 GitHub Actions 策略更新已停用。'
          echo '请使用本机 ChatGPT Plus/Codex private worker。'
