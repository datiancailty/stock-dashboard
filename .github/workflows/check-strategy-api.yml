name: 旧版策略 API 自检（已停用）

# ChatGPT Plus/Codex 路线不使用 GitHub-hosted runner，也不读取
# Platform 凭证。策略健康状态由本机 private worker 写入 Supabase。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 说明当前策略更新入口
        run: |
          echo '旧版 GitHub Actions/OpenAI Platform 自检已停用。'
          echo '请使用本机 ChatGPT Plus/Codex private worker。'
